services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm start"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: "0.0.0.0"
      JWT_SECRET: "change-this-before-production"
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: "http://localhost:3000"
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bunker
      POSTGRES_USER: bunker
      POSTGRES_PASSWORD: bunker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
